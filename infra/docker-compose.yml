services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: socialit
      POSTGRES_USER: socialit
      POSTGRES_PASSWORD: socialit_dev
    ports: ["5432:5432"]
    volumes: ["socialit-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialit -d socialit"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DEBUG: "true"
      DATABASE_URL: postgis://socialit:socialit_dev@db:5432/socialit
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_HOSTS: localhost,127.0.0.1,api
    ports: ["8000:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  socialit-postgres:
